
# Identitas proyek SonarQube
sonar.projectKey=ifs24051-pabwe2026-proyek1
sonar.projectName=ifs24051-pabwe2026-proyek1
sonar.sourceEncoding=UTF-8

# Lokasi kode aplikasi
sonar.sources=frontend/src

# Lokasi test
sonar.tests=frontend/src

# Kenali file test
sonar.test.inclusions=**/*.test.js,**/*.spec.js

# Jangan menghitung file test sebagai kode produksi
sonar.exclusions=**/*.test.js,**/*.spec.js,**/node_modules/**,**/coverage/**

# Laporan test coverage dari Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
