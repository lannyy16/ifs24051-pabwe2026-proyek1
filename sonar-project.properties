# Identitas proyek SonarQube
sonar.projectKey=ifs24051-pabwe2026-proyek1
sonar.projectName=ifs24051-pabwe2026-proyek1
sonar.sourceEncoding=UTF-8

# Lokasi kode aplikasi dan test
sonar.sources=frontend/src
sonar.tests=frontend/src

# Kenali file test (termasuk .jsx)
sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx

# Jangan menghitung file test sebagai kode produksi
sonar.exclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx,**/node_modules/**,**/coverage/**,**/dist/**

# Laporan test coverage dari Vitest (dibuat oleh: vitest run --coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
